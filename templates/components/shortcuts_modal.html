<!-- Keyboard Shortcuts Modal (?) -->
<div id="shortcutsBackdrop" class="cmd-palette-backdrop" style="display: none;">
  <div class="cmd-palette-modal" style="max-width: 500px;">
    <div style="background: var(--electric-blue); color: #fff; padding: 0.75rem 1.25rem; border-bottom: var(--border-thick); display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: var(--font-display); font-weight: 800; font-size: 0.9rem; text-transform: uppercase;">⌨️ Keyboard Shortcuts</span>
      <span style="font-family: var(--font-mono); font-size: 0.75rem; background: #fff; color: var(--ink-primary); padding: 2px 6px; border: 1.5px solid #14121F; border-radius: 4px;">ESC to close</span>
    </div>
    
    <div style="padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(20,18,31,0.08); padding-bottom: 0.5rem;">
        <span style="font-weight: 600;">Global Command Palette</span>
        <kbd style="background: var(--brand-yellow); padding: 3px 8px; border: 1.5px solid #14121F; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem;">⌘K / Ctrl+K</kbd>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(20,18,31,0.08); padding-bottom: 0.5rem;">
        <span style="font-weight: 600;">Show This Shortcuts Menu</span>
        <kbd style="background: #F1F5F9; padding: 3px 8px; border: 1.5px solid #14121F; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem;">?</kbd>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(20,18,31,0.08); padding-bottom: 0.5rem;">
        <span style="font-weight: 600;">Close Modal / Palette</span>
        <kbd style="background: #F1F5F9; padding: 3px 8px; border: 1.5px solid #14121F; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem;">Esc</kbd>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(20,18,31,0.08); padding-bottom: 0.5rem;">
        <span style="font-weight: 600;">Navigate to DBMS Lab</span>
        <kbd style="background: var(--violet-subtle); padding: 3px 8px; border: 1.5px solid var(--violet-royal); border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem;">L</kbd>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(20,18,31,0.08); padding-bottom: 0.5rem;">
        <span style="font-weight: 600;">Print / Save Invoice (Print-Optimized)</span>
        <kbd style="background: #F1F5F9; padding: 3px 8px; border: 1.5px solid #14121F; border-radius: 4px; font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem;">⌘P / Ctrl+P</kbd>
      </div>
    </div>
  </div>
</div>
