{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="container" style="max-width: 640px; padding: 4rem 1.25rem; text-align: center;">
  <div class="card" style="padding: 2.5rem 1.5rem;">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🔍</div>
    <span class="badge badge-yellow" style="margin-bottom: 1rem;">Page Not Found</span>
    <h1 style="font-size: 2.2rem; margin-bottom: 1rem;">Out of Bounds</h1>
    <p style="color: var(--ink-muted); margin-bottom: 2rem;">
      The page or branch you requested doesn't exist in the Jaskr GymGrid registry.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="{{ url_for('public.home') }}" class="btn btn-primary">Go to Home</a>
      <a href="{{ url_for('public.discover') }}" class="btn btn-accent">Discover Gyms</a>
    </div>
  </div>
</div>
{% endblock %}
