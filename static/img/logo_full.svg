<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" fill="none" class="jaskr-logo">
  <!-- 3x3 Crowd Heat Grid Motif -->
  <g transform="translate(4, 4)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#10B981" stroke="#14121F" stroke-width="2.5" />
    <rect x="20" y="0" width="16" height="16" rx="3" fill="#FFD60A" stroke="#14121F" stroke-width="2.5" />
    <rect x="40" y="0" width="16" height="16" rx="3" fill="#F43F5E" stroke="#14121F" stroke-width="2.5" />
    <!-- Row 2 -->
    <rect x="0" y="20" width="16" height="16" rx="3" fill="#FFD60A" stroke="#14121F" stroke-width="2.5" />
    <rect x="20" y="20" width="16" height="16" rx="3" fill="#FFD60A" stroke="#14121F" stroke-width="2.5" />
    <rect x="40" y="20" width="16" height="16" rx="3" fill="#10B981" stroke="#14121F" stroke-width="2.5" />
    <!-- Row 3 -->
    <rect x="0" y="40" width="16" height="16" rx="3" fill="#10B981" stroke="#14121F" stroke-width="2.5" />
    <rect x="20" y="40" width="16" height="16" rx="3" fill="#F43F5E" stroke="#14121F" stroke-width="2.5" />
    <rect x="40" y="40" width="16" height="16" rx="3" fill="#FFD60A" stroke="#14121F" stroke-width="2.5" />
  </g>
  <!-- Wordmark -->
  <text x="74" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#14121F" letter-spacing="-1">Jaskr</text>
  <text x="168" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="400" fill="#14121F" letter-spacing="-0.5">Gym<tspan font-weight="800" fill="#2563EB">Grid</tspan></text>
</svg>
