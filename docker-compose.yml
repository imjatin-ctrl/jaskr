version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gymgrid_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gymgrid
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/constraints_indexes.sql:/docker-entrypoint-initdb.d/02_constraints.sql
      - ./db/views.sql:/docker-entrypoint-initdb.d/03_views.sql
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/04_procedures.sql
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/05_triggers.sql
      - ./db/dcl.sql:/docker-entrypoint-initdb.d/06_dcl.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

volumes:
  db_data:
